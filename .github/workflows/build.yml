name: Build Mesh Messenger APK

on:
  push:
    branches: [ main, android ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (manual)
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Install Android SDK Command-line Tools
        run: |
          # Fallback: install cmdline-tools manually if needed
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk
          if [ ! -d cmdline-tools/latest ]; then
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
            unzip -q cmdtools.zip -d cmdline-tools
            mv cmdline-tools/cmdline-tools cmdline-tools/latest || true
            rm -f cmdtools.zip
          fi
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept licenses and install packages
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-$HOME/android-sdk}
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" || true

      - name: Create local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$HOME/android-sdk}" > local.properties

      - name: Create Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9 || true
          if [ ! -f gradlew ]; then
            # Minimal wrapper bootstrap
            mkdir -p gradle/wrapper
            curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar || true
            cat > gradle/wrapper/gradle-wrapper.properties << 'PROP'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
PROP
            cat > gradlew << 'EOF'
#!/bin/sh
exec java -jar gradle/wrapper/gradle-wrapper.jar "$@"
EOF
            chmod +x gradlew
          fi
          chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-$HOME/android-sdk}
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          ./gradlew assembleDebug --stacktrace --no-daemon --info 2>&1 | tail -100

      - name: Find and list APKs
        if: always()
        run: |
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-messenger-apk
          path: |
            app/build/outputs/apk/**/*.apk
            **/*.apk
          if-no-files-found: warn
          retention-days: 14
